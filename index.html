<title>AMQF Planning &amp; Reporting — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f6;--surface:#fff;--ink:#111;--ink2:#555;--ink3:#8a8a8a;--line:#e2e2e2;
  --brand:#111;--brand-d:#000;--brand-l:#efefef;--accent:#555;
  --ok:#111;--prog:#8a8a8a;--late:#b3261e;--none:#d0d0d0;
  --ok-l:#e9e9e9;--prog-l:#f0f0f0;--late-l:#f8e4e2;--none-l:#f3f3f3;
  --r:12px;--sh:0 1px 2px rgba(0,0,0,.05);
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit;accent-color:#111}
button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:#111;color:#eee;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#eee;color:#111;font-weight:700;letter-spacing:.5px}
.logo span{font-weight:600;line-height:1.25;font-size:13.5px}
.logo small{display:block;font-weight:400;opacity:.7;font-size:11.5px}
.nav button{all:unset;box-sizing:border-box;display:flex;gap:11px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer;color:#ccc}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current=page]{background:#eee;color:#111;font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-inline-start:auto;background:#fff;color:#111;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;font-size:11.5px;opacity:.75;padding:8px}
main{min-width:0}
.top{display:flex;gap:12px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:600}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 13px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 5px;background:var(--surface);cursor:pointer}
.chip i{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
.chip small{display:block;color:var(--ink3);font-size:11px;line-height:1.1}
.wrap{padding:24px 28px 60px;max-width:1280px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.card h3 small{font-weight:400;color:var(--ink3)}
.kpi .v{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink2);font-size:13px;margin-top:4px}
.kpi .d{font-size:12px;margin-top:8px;display:inline-flex;gap:4px;padding:1px 8px;border-radius:99px;background:var(--none-l);color:var(--ink2)}
.kpi .d.up{background:var(--ok-l);color:var(--ok)}.kpi .d.down{background:var(--late-l);color:var(--late)}
.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media(max-width:1000px){.two{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.side-foot{display:none}.logo{padding:4px}}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-Completed{background:var(--ok-l);color:var(--ok)}.s-In-Progress{background:var(--prog-l);color:var(--prog)}
.s-Delayed{background:var(--late-l);color:var(--late)}.s-Not-Started{background:var(--none-l);color:var(--ink2)}.s-none{background:transparent;color:var(--ink3);border:1px dashed var(--line)}
.bar{height:8px;border-radius:99px;background:var(--none-l);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.c-Completed{background:var(--ok)}.c-In-Progress{background:var(--prog)}.c-Delayed{background:var(--late)}.c-Not-Started{background:var(--none)}
.row-bar{display:grid;grid-template-columns:200px 1fr 52px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.row-bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-bar .n small{color:var(--ink3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px;background:var(--c)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--ink3);font-size:12px;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--brand-l)}
.num{font-variant-numeric:tabular-nums;text-align:end}
.att{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.att:last-child{border:0}
.att .dot{flex:none;width:8px;border-radius:4px;background:var(--late)}
.att b{font-weight:500;display:block}
.att small{color:var(--ink2)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;min-height:36px}
textarea{width:100%;resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;min-height:36px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-d)}
.btn.sm{padding:3px 10px;min-height:28px;font-size:13px}
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px;overflow:hidden}
.acc>summary{list-style:none;padding:14px 18px;cursor:pointer;display:flex;gap:14px;align-items:center;font-weight:600}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:before{content:"›";font-size:20px;color:var(--ink3);transition:.15s;display:inline-block}
[dir=rtl] .acc>summary:before{content:"‹"}
.acc[open]>summary:before{transform:rotate(90deg)}
.acc .meta{margin-inline-start:auto;display:flex;gap:16px;align-items:center;font-weight:400;font-size:13px;color:var(--ink2)}
.acc .meta .bar{width:120px}
.ki{border-top:1px solid var(--line);background:var(--bg)}
.ki>summary{padding:11px 18px;font-weight:500;display:flex;gap:10px;align-items:baseline;list-style:none}.ki>summary::-webkit-details-marker{display:none}.ki>summary:before{content:'›';color:var(--ink3)}[dir=rtl] .ki>summary:before{content:'‹'}.ki[open]>summary:before{display:inline-block;transform:rotate(90deg)}
.ki .tb{padding:0 12px 12px;background:var(--surface)}
.tcode{background:var(--brand-l);color:var(--brand);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap}
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(520px,100%);background:var(--surface);box-shadow:0 0 40px rgba(0,0,0,.25);z-index:20;overflow:auto;padding:22px;transform:translateX(0)}
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.4);z-index:19}
.drawer h2{font-size:17px;margin:0 0 6px;line-height:1.5}
.drawer .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13.5px;margin:14px 0}
.drawer .kv dt{color:var(--ink3)}.drawer .kv dd{margin:0}
.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.field .err{color:var(--late);font-size:12.5px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 8px}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--ink2)}
.tabs button[aria-selected=true]{border-color:var(--brand);color:var(--brand);font-weight:600}
.cmt{display:flex;gap:10px;margin:12px 0}
.cmt i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--prog-l);color:var(--prog);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
.cmt .b{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13.5px;flex:1}
.cmt small{color:var(--ink3)}
.toast{position:fixed;inset-block-end:22px;inset-inline-end:22px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.hint{background:var(--brand-l);color:var(--brand-d);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .hint{color:var(--ink)}}
.split{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:40px 44px;box-shadow:var(--sh);min-height:600px;font-size:13.5px}
.paper h1{font-size:21px;margin:0 0 4px;color:#111}.paper h2{font-size:15px;margin:22px 0 8px;color:#111;border-bottom:2px solid #111;padding-bottom:3px}
.paper table td,.paper table th{font-size:12.5px;padding:6px 8px;border-bottom:1px solid #e2e2e2;color:#111}
.paper .sub{color:#555;font-size:12.5px}
.paper .kp{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}.paper .kp div{flex:1;min-width:110px;border:1px solid #e2e2e2;border-radius:8px;padding:8px 12px}
.paper .kp b{font-size:20px;display:block}
.login{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center}
.login .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px;width:min(400px,92vw);box-shadow:var(--sh);text-align:center}
.ms{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;border:1px solid #8c8c8c;background:#fff;color:#5e5e5e;border-radius:3px;padding:10px;font-weight:600;margin-top:18px}
.ms span{display:grid;grid-template-columns:repeat(2,9px);gap:2px}.ms span i{width:9px;height:9px}
.empty{color:var(--ink3);padding:22px;text-align:center}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0}
.stack i{display:block}
@media print{aside,.top,.rep-cfg,.no-print{display:none!important}.app{display:block}.wrap{padding:0;max-width:none}.paper{border:0;box-shadow:none;padding:0}.split{display:block}}
</style>
</head>

/* ================= helpers ================= */
function stats(list,q){const c={Completed:0,'In Progress':0,Delayed:0,'Not Started':0,'':0};let ps=0,pn=0;
 list.forEach(x=>{const r=g(x,q);c[r.s||'']++;if(r.p!=null){ps+=r.p;pn++}});return{c,n:list.length,avg:pn?ps/pn/100:null,rep:(list.length-c[''])/list.length}}
function stackBar(c,n){return `<div class="bar" role="img" aria-label="${STAT.map(s=>sLbl(s)+' '+c[s]).join(', ')}">${STAT.map(s=>c[s]?`<i class="c-${sKey(s)}" style="width:${c[s]/n*100}%" title="${sLbl(s)}: ${c[s]}"></i>`:'').join('')}</div>`}
function pill(s){return `<span class="pill s-${sKey(s)}">${sLbl(s)}</span>`}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const kiOf=c=>D.kis.find(k=>k.code===c);
const pendingN=()=>S.reqs.filter(r=>r.status==='pending').length;

 const teamRows=teams.filter(x=>x!=='Other').map(tm=>{const l=all.filter(x=>x.team===tm),s=stats(l,q);return `<div class="row-bar"><div class="n"><b>${tm}</b> <small>${l.length}</small></div>${stackBar(s.c,s.n)}<div class="num">${s.c.Delayed?`<span style="color:var(--late)">⚠ ${s.c.Delayed}</span>`:''}</div></div>`}).join('');
 const mrows=D.media.slice(0,6).map(m=>{const v=q===1?m.q1:(m.q1||0)+(m.q2||0);return m});
 const att=delayed.slice(0,5).map(x=>`<div class="att" data-open="${x.id}"><span class="dot"></span><div><b>${esc(x.title)}</b><small>${x.team} · ${esc(x.lead)} — ${esc(g(x,q).n).slice(0,110)}…</small></div></div>`).join('')||`<div class="empty">✓</div>`;
 const legend=`<div class="legend">${STAT.map(s=>`<span style="--c:var(--${({Completed:'ok','In Progress':'prog',Delayed:'late','Not Started':'none'})[s]})">${sLbl(s)}</span>`).join('')}</div>`;
 return `<div class="wrap">
 <div class="grid kpis">
  ${kpi(fmt(st.n),t('tasks'),`${fmt(st.c.Completed)} ${t('completed')}`,'')}
  ${kpi(pct(st.avg),t('avg'),dDone!=null?`${dDone>=0?'▲':'▼'} ${Math.abs(dDone)} ${t('completed')} ${t('vsQ1')}`:'',dDone>0?'up':'')}
  ${kpi(fmt(st.c.Delayed),t('delayed'),p?`${st.c.Delayed-p.c.Delayed>=0?'▲':'▼'} ${Math.abs(st.c.Delayed-p.c.Delayed)} ${t('vsQ1')}`:'',st.c.Delayed>(p?p.c.Delayed:0)?'down':'up')}
  ${kpi(pct(st.rep),t('reporting'),dRep!=null?`${dRep>=0?'▲':'▼'} ${Math.abs(dRep)} pts ${t('vsQ1')}`:'',dRep>0?'up':'down')}
  ${kpi(fmt(part),t('reach'),partP!=null?`${part>=partP?'▲':'▼'} ${Math.abs(Math.round((part-partP)/partP*100))}% ${t('vsQ1')}`:t('reachSub'),part>=partP?'up':'down')}
  ${kpi('$'+fmt(bud),t('budget'),'')}
 </div>

  <div class="card"><h3>${t('attention')} <small>${t('attentionSub')} · ${delayed.length}</small></h3>${att}</div>
 </div>
 <div class="grid two" style="margin-top:16px">

function taskRows(list,q){return list.map(x=>{const r=g(x,q);return `<tr class="click" data-open="${x.id}"><td>${esc(x.title)}</td><td>${x.team}</td><td>${esc(x.lead)}</td><td>${esc(x.tl)}</td><td>${pill(r.s||'')}</td><td class="num">${r.p==null?'—':r.p+'%'}</td></tr>`}).join('')}

 return h+'</div>'}

  <div><h3 class="no-print" style="margin:0 0 10px">${t('gen')}</h3>${preview}</div></div></div>`}
function sLblL(s,L){return ({Completed:tl(L,'completed'),'In Progress':tl(L,'inprog'),Delayed:tl(L,'delayed'),'Not Started':tl(L,'notstarted'),'':tl(L,'noupd')})[s]}

function viewInbox(){
 const rows=S.reqs.map(r=>`<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill ${r.kind==='change'?'s-Delayed':'s-In-Progress'}">${r.kind==='change'?t('kindChange'):t('kindComment')}</span>${r.ki?`<span class="tcode">${r.ki}</span>`:''}<b>${esc(r.by)}</b><span class="sp"></span>${r.kind==='change'?`<span class="pill ${r.status==='pending'?'s-Not-Started':r.status==='approved'?'s-Completed':'s-Delayed'}">${t(r.status)}</span>`:''}</div><p style="margin:10px 0">${esc(r.text)}</p>${r.task?`<button class="btn sm" data-open="${r.task}">↗ ${esc(D.tasks.find(x=>x.id===r.task)?.title.slice(0,50)||'')}…</button>`:''}${r.kind==='change'&&r.status==='pending'&&S.role==='admin'?` <button class="btn sm pri" data-dec="${r.id}|approved">${t('approve')}</button> <button class="btn sm" data-dec="${r.id}|rejected">${t('reject')}</button>`:''}</div>`).join('');
 return `<div class="wrap" style="max-width:820px">${rows||'<div class="empty">—</div>'}</div>`}

/* ================= drawer ================= */
function drawer(){
 const x=D.tasks.find(v=>v.id===S.open);if(!x)return '';
 const q=S.dq,r=g(x,q),ed=canEdit(x),k=kiOf(x.ki);
 const cm=S.cmts[x.id]||[];
 return `<div class="scrim" id="scrim"></div><div class="drawer" role="dialog" aria-label="Task"><button class="btn sm" id="close" style="float:inline-end">✕</button>
 <span class="tcode">${x.ki}</span><h2 style="margin-top:8px">${esc(x.title)}</h2>
 <dl class="kv"><dt>${t('outputs')}</dt><dd>${esc(x.out)}</dd><dt>${t('team')}</dt><dd>${x.team}</dd><dt>${t('lead')}</dt><dd>${esc(x.lead)}</dd><dt>${t('timeline')}</dt><dd>${esc(x.tl)}</dd><dt>${t('funding')}</dt><dd>${esc(x.fund)||'—'} ${k&&k.fund?'· '+esc(k.fund):''}</dd></dl>
 <div class="tabs" role="tablist">${[1,2,3,4].map(n=>`<button role="tab" aria-selected="${q===n}" data-dq="${n}" ${n>2?'disabled style="opacity:.4"':''}>Q${n}</button>`).join('')}</div>
 ${!ed?`<div class="hint">${t('readonly')}</div>`:''}
 <div class="field"><label>${t('status')}</label><select id="dS" ${ed?'':'disabled'}>${['',...STAT].map(s=>`<option value="${s}" ${r.s===s?'selected':''}>${sLbl(s)}</option>`).join('')}</select></div>
 <div class="field"><label>${t('completion')}: <b id="dPv">${r.p??0}%</b></label><input type="range" id="dP" min="0" max="100" step="5" value="${r.p??0}" style="width:100%" ${ed?'':'disabled'}></div>
 <div class="field"><label>${t('notes')}</label><textarea id="dN" ${ed?'':'disabled'}>${esc(r.n)}</textarea><div class="err" id="dE"></div></div>
 <div class="field"><label>${t('impl')}</label><textarea id="dI" ${ed?'':'disabled'}>${esc(r.i)}</textarea></div>
 ${ed?`<button class="btn pri" id="dSave">${t('save')}</button>`:''}
 <h3 style="margin:24px 0 4px">${t('comments')} <small>(${cm.length})</small></h3>
 ${cm.map(c=>`<div class="cmt"><i>${c.by[0]}</i><div class="b"><b>${esc(c.by)}</b> <small>${c.kind==='change'?'· '+t('kindChange'):''}</small><div>${esc(c.text)}</div></div></div>`).join('')}
 <div class="field"><textarea id="cT" placeholder="${t('addComment')}" style="min-height:56px"></textarea></div>
 <div style="display:flex;gap:8px"><button class="btn" id="cSend">${t('send')}</button><button class="btn" id="cReq">${t('reqChange')}</button></div></div>`}

/* ================= shell ================= */
function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 const nav=[['dash','dash'],['plan','plan'],['data','data'],['reports','reports'],['inbox','inbox']];
 const V={dash:viewDash,plan:viewPlan,data:viewData,reports:viewReports,inbox:viewInbox}[S.view]();
 const q=S.view==='plan'?S.q:S.dq;
 document.getElementById('root').innerHTML=`<div class="app"><aside><div class="logo"><b>AM</b><span>${t('org')}<small>${t('app')}</small></span></div><nav class="nav">${nav.map(([k,i])=>`<button data-nav="${k}" ${S.view===k?'aria-current="page"':''}>${svg(i)} ${t(k)}${k==='inbox'&&pendingN()?`<span class="badge">${pendingN()}</span>`:''}</button>`).join('')}</nav><div class="side-foot">${t('demo')}</div></aside>
 <main><div class="top"><h1>${t(S.view)}</h1><span class="sp"></span>
  ${['dash','plan'].includes(S.view)?`<div class="seg" role="group" aria-label="Quarter">${[1,2,3,4].map(n=>`<button data-q="${n}" aria-pressed="${(S.view==='plan'?S.q:S.dq)===n}" ${n>2?'disabled title="—"':''}>Q${n}</button>`).join('')}</div>`:''}
  <div class="seg" role="group"><button data-lang="ar" aria-pressed="${S.lang==='ar'}">عربي</button><button data-lang="en" aria-pressed="${S.lang==='en'}">EN</button></div>
  <label class="chip" title="${t('role')}"><i>${(S.lang==='ar'?T.ar.userN:T.en.userN)[0]}</i><span><small>${t('role')} · Microsoft SSO</small><select id="role" style="border:0;background:none;padding:0;min-height:0;font-size:13px"><option value="admin" ${S.role==='admin'?'selected':''}>${t('admin')}</option><option value="lead" ${S.role==='lead'?'selected':''}>${t('leadRole')}</option><option value="viewer" ${S.role==='viewer'?'selected':''}>${t('viewer')}</option></select></span></label></div>
 ${V}</main></div>${drawer()}`;
 bind();}

function bind(){
 const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
 $$('[data-nav]').forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;S.open=null;render();window.scrollTo(0,0)});
 $$('[data-lang]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;S.rep.lang=S.lang;persist();render()});
 $$('[data-q]').forEach(b=>b.onclick=()=>{S.view==='plan'?S.q=+b.dataset.q:S.dq=+b.dataset.q;render()});
 $$('[data-open]').forEach(b=>b.onclick=()=>{S.open=+b.dataset.open;S.dq=S.view==='plan'?S.q:S.dq;render()});
 $('#role')&&($('#role').onchange=e=>{S.role=e.target.value;render()});
 $('#fText')&&($('#fText').oninput=e=>{S.fText=e.target.value;const p=e.target.selectionStart;render();const n=$('#fText');n.focus();n.setSelectionRange(p,p)});
 $('#fTeam')&&($('#fTeam').onchange=e=>{S.fTeam=e.target.value;render()});
 $('#fStat')&&($('#fStat').onchange=e=>{S.fStat=e.target.value;render()});
 $$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
 $$('[data-m]').forEach(i=>i.oninput=e=>{const[n,k]=i.dataset.m.split('|');(S.mediaEdit[n]=S.mediaEdit[n]||{})[k]=e.target.value===''?null:+e.target.value;const p=e.target.selectionStart;render();const nn=document.querySelector(`[data-m="${n}|${k}"]`);nn&&nn.focus()});
 // outreach form
 const calc=()=>{const v=k=>+($('#a_'+k)?.value)||0;$('#aTot')&&($('#aTot').textContent=fmt(v('f18')+v('m18')+v('f0')+v('m0')))};
 ['f18','m18','f0','m0','pwd'].forEach(k=>$('#a_'+k)&&($('#a_'+k).oninput=calc));
 $('#aAdd')&&($('#aAdd').onclick=()=>{const v=k=>+($('#a_'+k).value)||0;const id=Date.now();const qq='Q'+S.dq;(S.add[qq]=S.add[qq]||{})[id]={type:$('#aType').value,geo:$('#aGeo').value,ev:+$('#aEv').value||0,f18:v('f18'),m18:v('m18'),f0:v('f0'),m0:v('m0'),pwd:v('pwd')};toast(t('saved'));render()});
 // reports
 $$('.rep-cfg input[type=radio]').forEach(i=>i.onchange=()=>{S.rep[i.name]=i.value;render()});
 $('#repSp')&&($('#repSp').onchange=e=>{S.rep.sp=e.target.value;render()});
 $('#xPdf')&&($('#xPdf').onclick=()=>{toast(t('exportedPdf'));setTimeout(()=>window.print(),500)});
 $('#xDoc')&&($('#xDoc').onclick=()=>toast(t('exportedWord')));
 $('#xCsv')&&($('#xCsv').onclick=()=>{const q=S.rep.period==='q1'?1:2;const rows=[['ID','KI','Task','Team','Lead','Timeline','Status','Completion %','Notes']].concat(D.tasks.map(x=>{const r=g(x,q);return [x.id,x.ki,x.title,x.team,x.lead,x.tl,r.s,r.p??'',r.n]}));const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='AMQF-Q'+q+'-progress.csv';a.click()});
 // inbox decisions
 $$('[data-dec]').forEach(b=>b.onclick=()=>{const[id,s]=b.dataset.dec.split('|');S.reqs.find(r=>r.id==id).status=s;persist();render()});
 // drawer
 if(S.open){
  const close=()=>{S.open=null;render()};$('#close').onclick=close;$('#scrim').onclick=close;
  $$('[data-dq]').forEach(b=>b.onclick=()=>{S.dq=+b.dataset.dq;render()});
  const dS=$('#dS'),dP=$('#dP');
  if(dS&&!dS.disabled){dP.oninput=()=>$('#dPv').textContent=dP.value+'%';
   dS.onchange=()=>{if(dS.value==='Completed'){dP.value=100}if(dS.value==='Not Started'){dP.value=0}$('#dPv').textContent=dP.value+'%'};
   $('#dSave').onclick=()=>{if(dS.value==='Delayed'&&!$('#dN').value.trim()){$('#dE').textContent=t('needNote');return}
    S.prog[S.open+'|'+S.dq]={s:dS.value,p:+dP.value,n:$('#dN').value,i:$('#dI').value};persist();toast(t('saved'));render()}}
  const send=kind=>{const v=$('#cT').value.trim();if(!v)return;const x=D.tasks.find(z=>z.id===S.open);(S.cmts[S.open]=S.cmts[S.open]||[]).push({by:T[S.lang].userN,text:v,kind});
   if(kind==='change'){S.reqs.unshift({id:Date.now(),task:S.open,kind:'change',by:T[S.lang].userN,text:v,status:'pending',ki:x.ki});toast(t('reqSent'))}persist();render()};
  $('#cSend').onclick=()=>send('comment');$('#cReq').onclick=()=>{const c=$('#cT');if(!c.value.trim()){c.placeholder=t('reqPlaceholder');c.focus();return}send('change')};
 }
}
